[project]
name = "caetus-os-mcp"
version = "0.1.0"
description = "Servidor MCP do Caetus OS: deixa qualquer agente (Claude, ChatGPT, OpenCode...) usar a marca, as habilidades e a biblioteca da sua empresa."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.scripts]
caetus-os-mcp = "caetus_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["caetus_mcp"]
