services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: caetus
      POSTGRES_PASSWORD: caetus
      POSTGRES_DB: caetus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://caetus:caetus@db:5432/caetus
      STORAGE_BACKEND: filesystem
      STORAGE_ROOT: /data/storage
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
    ports:
      - "8000:8000"
    volumes:
      - storagedata:/data/storage
      - ./:/app

volumes:
  pgdata:
  storagedata:
